{% extends "base.html" %}
{% block content %}
<h1>How was {{ event.name }}?</h1>
<p class="muted">Feedback for {{ attendee.name }}</p>
<form method="post" class="card">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<fieldset class="rating">{% for i in range(1, 6) %}<label><input type="radio" name="rating" value="{{ i }}" required> {{ i }}</label>{% endfor %}</fieldset>
<label>Comment (optional) <textarea name="comment" maxlength="1000" rows="4"></textarea></label>
<button>Submit</button>
</form>
{% endblock %}
